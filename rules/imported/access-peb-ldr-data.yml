rule:
  meta:
    name: access PEB ldr_data
    namespace: linking/runtime-linking
    scope: basic block
    authors:
      - moritz.raabe@mandiant.com
    description: access PEB ldr_data
    references:
      - https://www.geoffchappell.com/studies/windows/km/ntoskrnl/inc/api/ntpsapi_x/peb_ldr_data.htm
      - https://github.com/d35ha/CallObfuscator/blob/5834aff9ff4511f1408ae4ce80b79737af4ae77b/ShellCode/shell_x64.asm#L8
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Execution::Shared Modules [T1129]
  features:
    - or:
        - and:
            - arch: i386
            - match: PEB access
            - offset: 12
            - or:
                - offset: 12
                - offset: 20
                - offset: 28
        - and:
            - arch: amd64
            - match: PEB access
            - offset: 24
            - or:
                - offset: 16
                - offset: 32
                - offset: 48

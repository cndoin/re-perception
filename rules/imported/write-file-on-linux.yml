rule:
  meta:
    name: write file on Linux
    namespace: host-interaction/file-system/write
    scope: instruction
    authors:
      - joakim@intezer.com
      - mehunhoff@google.com
    description: write file on Linux
    references:
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
  features:
    - and:
        - or:
            - os: linux
            - os: android
        - or:
            - api: fputc
            - api: fputs
            - api: putc
            - api: write
            - api: fputwc
            - api: putwc
            - api: fputws
            - api: fwrite
            - api: putwchar
            - api: dprintf
            - api: vdprintf
            - api: fprintf
            - api: vfprintf

rule:
  meta:
    name: persist via Windows Error Reporting registry key
    namespace: persistence/registry
    scope: function
    authors:
      - j.j.vannielen@utwente.nl
    description: persist via Windows Error Reporting registry key
    references:
      - https://www.hexacorn.com/blog/2019/09/20/beyond-good-ol-run-key-part-116/
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Persistence::Event Triggered Execution [T1546]
  features:
    - and:
        - match: set registry value
        - string: /Microsoft\\Windows\\Windows Error Reporting\\Hangs/i
        - string: /Debugger/i

rule:
  meta:
    name: run as service
    namespace: host-interaction/service
    scope: file
    authors:
      - moritz.raabe@mandiant.com
      - mehunhoff@google.com
    description: run as service
    references:
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
  features:
    - or:
        - export: ServiceMain
        - instruction:
            or:
              - api: RegisterServiceCtrlHandler
              - api: RegisterServiceCtrlHandlerEx
              - api: StartServiceCtrlDispatcher
              - api: System.ServiceProcess.ServiceBase::Run

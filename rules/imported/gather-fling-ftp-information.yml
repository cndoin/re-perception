rule:
  meta:
    name: gather fling-ftp information
    namespace: collection/file-managers
    scope: function
    authors:
      - "@_re_fox"
    description: gather fling-ftp information
    references:
      - https://www.nchsoftware.com/fling/index.html
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Credential Access::Credentials from Password Stores [T1555]
  features:
    - or:
        - substring: SOFTWARE\\NCH Software\\Fling\\Accounts
        - and:
            - string: FtpPassword
            - string: _FtpPassword
            - string: FtpServer
            - string: FtpUserName
            - string: FtpDirectory

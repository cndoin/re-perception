rule:
  meta:
    name: execute shell command and capture output
    namespace: communication/c2/shell
    scope: function
    authors:
      - matthew.williams@mandiant.com
    description: execute shell command and capture output
    references:
      - https://docs.microsoft.com/en-us/windows/win32/api/processthreadsapi/ns-processthreadsapi-startupinfoa
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Execution::Command and Scripting Interpreter::Windows Command Shell [T1059.003]
  features:
    - and:
        - match: create a process with modified I/O handles and window
        - match: create pipe
        - or:
            - match: get COMSPEC environment variable
            - string: \\cmd.exe
            - string: cmd.exe
            - string: cmd.exe /c
            - string: C:\\Windows\\system32\\cmd.exe

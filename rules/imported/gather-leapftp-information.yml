rule:
  meta:
    name: gather leapftp information
    namespace: collection/file-managers
    scope: function
    authors:
      - "@_re_fox"
    description: gather leapftp information
    references:
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Credential Access::Credentials from Password Stores [T1555]
  features:
    - or:
        - and:
            - string: InstallPath
            - string: DataDir
            - string: sites.dat
            - string: sites.ini
        - and:
            - or:
                - substring: SOFTWARE\\LeapWare
                - substring: \\LeapWare\\LeapFTP
            - 2 or more:
                - string: sites.dat
                - string: sites.ini
                - string: leapftp

rule:
  meta:
    name: reference anti-VM strings targeting Parallels
    namespace: anti-analysis/anti-vm/vm-detection
    scope: file
    authors:
      - michael.hunhoff@mandiant.com
    description: reference anti-VM strings targeting Parallels
    references:
      - https://github.com/LordNoteworthy/al-khaser/blob/master/al-khaser/AntiVM/Parallels.cpp
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Defense Evasion::Virtualization/Sandbox Evasion::System Checks [T1497.001]
  features:
    - or:
        - string: /Parallels/i
        - string: /prl_cc\.exe/i
        - string: /prl_tools\.exe/i
        - string: /prl hyperv/i

rule:
  meta:
    name: create process on Linux
    namespace: host-interaction/process/create
    scope: basic block
    authors:
      - joakim@intezer.com
      - mehunhoff@google.com
    description: create process on Linux
    references:
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
  features:
    - and:
        - or:
            - os: linux
            - os: android
        - or:
            - api: execve
            - and:
                - match: execute syscall
                - arch: aarch64
                - number: 221
            - api: execl
            - api: execlp
            - api: execle
            - api: execv
            - api: execvp
            - api: execvpe
            - api: posix_spawn
            - api: posix_spawnp
            - api: popen
            - api: fork

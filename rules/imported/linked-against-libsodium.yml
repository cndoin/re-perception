rule:
  meta:
    name: linked against libsodium
    namespace: linking/static/crypto
    scope: file
    authors:
      - "@mr-tz"
    description: Sodium is a software library for encryption, decryption, signatures, password hashing and more.
    references:
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
  features:
    - or:
        - string: sodium_crit_enter
        - string: _sodium_malloc
        - string: randombytes_sysrandom_implementation

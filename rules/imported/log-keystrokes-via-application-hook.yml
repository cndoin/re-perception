rule:
  meta:
    name: log keystrokes via application hook
    namespace: collection/keylog
    scope: basic block
    authors:
      - michael.hunhoff@mandiant.com
    description: log keystrokes via application hook
    references:
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Collection::Input Capture::Keylogging [T1056.001]
  features:
    - and:
        - match: set application hook
        - or:
            - number: 13
            - number: 2

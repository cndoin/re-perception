rule:
  meta:
    name: gather directory-opus information
    namespace: collection/file-managers
    scope: function
    authors:
      - "@_re_fox"
    description: gather directory-opus information
    references:
      - https://www.gpsoft.com.au/
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Credential Access::Credentials from Password Stores [T1555]
  features:
    - and:
        - substring: \\GPSoftware\\Directory Opus
        - string: .oxc
        - string: .oll
        - string: ftplast.osd

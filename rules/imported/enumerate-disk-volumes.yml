rule:
  meta:
    name: enumerate disk volumes
    namespace: host-interaction/hardware/storage
    scope: function
    authors:
      - michael.hunhoff@mandiant.com
    description: enumerate disk volumes
    references:
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Discovery::System Information Discovery [T1082]
  features:
    - and:
        - match: contain loop
        - or:
            - and:
                - api: kernel32.FindFirstVolume
                - api: kernel32.FindNextVolume
            - and:
                - api: kernel32.FindFirstVolumeMountPoint
                - api: kernel32.FindNextVolumeMountPoint

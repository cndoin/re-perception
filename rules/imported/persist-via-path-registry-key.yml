rule:
  meta:
    name: persist via PATH registry key
    namespace: persistence/registry
    scope: function
    authors:
      - j.j.vannielen@utwente.nl
    description: persist via PATH registry key
    references:
      - https://attack.mitre.org/techniques/T1574/007/
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Persistence::Hijack Execution Flow::Path Interception by PATH Environment Variable [T1574.007]
  features:
    - and:
        - match: set registry value
        - string: /Environment/i
        - string: /^PATH$/i

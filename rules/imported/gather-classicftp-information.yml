rule:
  meta:
    name: gather classicftp information
    namespace: collection/file-managers
    scope: function
    authors:
      - "@_re_fox"
    description: gather classicftp information
    references:
      - https://www.nchsoftware.com/classic/index.html
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Credential Access::Credentials from Password Stores [T1555]
  features:
    - substring: Software\\NCH Software\\ClassicFTP\\FTPAccounts

rule:
  meta:
    name: get number of processors
    namespace: host-interaction/hardware/cpu
    scope: function
    authors:
      - michael.hunhoff@mandiant.com
      - anushka.virgaonkar@mandiant.com
    description: get number of processors
    references:
      - https://github.com/LordNoteworthy/al-khaser/blob/bed03d2f849d9060c68f8d5905bd204d0cb3f593/al-khaser/AntiVM/Generic.cpp#L361
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Discovery::System Information Discovery [T1082]
  features:
    - and:
        - match: PEB access
        - or:
            - and:
                - arch: i386
                - number: 100
            - and:
                - arch: amd64
                - number: 184

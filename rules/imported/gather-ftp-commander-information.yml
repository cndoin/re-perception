rule:
  meta:
    name: gather ftp-commander information
    namespace: collection/file-managers
    scope: function
    authors:
      - "@_re_fox"
    description: gather ftp-commander information
    references:
      - https://www.ftpcommander.com/free.htm
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Credential Access::Credentials from Password Stores [T1555]
  features:
    - and:
        - or:
            - substring: FTP Navigator
            - substring: FTP Commander
        - string: ftplist.txt

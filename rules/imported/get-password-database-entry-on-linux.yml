rule:
  meta:
    name: get password database entry on Linux
    namespace: host-interaction/session
    scope: instruction
    authors:
      - michael.hunhoff@mandiant.com
      - jonathanlepore@google.com
    description: get password database entry on Linux
    references:
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
  features:
    - and:
        - or:
            - os: linux
            - os: android
        - or:
            - api: getpwuid
            - api: getpwuid_r
            - api: getpwnam
            - api: getpwnam_r
            - api: getpwent
            - api: fgetpwent
            - api: getpwent_r
            - api: fgetpwent_r

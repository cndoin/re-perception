rule:
  meta:
    name: get process heap force flags
    namespace: host-interaction/process
    scope: basic block
    authors:
      - michael.hunhoff@mandiant.com
    description: get process heap force flags
    references:
      - https://github.com/LordNoteworthy/al-khaser/blob/bed03d2f849d9060c68f8d5905bd204d0cb3f593/al-khaser/AntiDebug/ProcessHeap_ForceFlags.cpp#L14
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Discovery::Process Discovery [T1057]
  features:
    - and:
        - match: PEB access
        - or:
            - and:
                - arch: i386
                - number: 24
                - or:
                    - number: 68
                    - number: 16
            - and:
                - arch: amd64
                - number: 48
                - or:
                    - number: 116
                    - number: 24

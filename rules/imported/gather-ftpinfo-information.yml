rule:
  meta:
    name: gather ftpinfo information
    namespace: collection/file-managers
    scope: function
    authors:
      - "@_re_fox"
    description: gather ftpinfo information
    references:
      - https://www.ftpinfo.ru/
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Credential Access::Credentials from Password Stores [T1555]
  features:
    - and:
        - string: ServerList.xml
        - string: DataDir
        - or:
            - substring: Software\\MAS-Soft\\FTPInfo\\Setup
            - substring: FTPInfo

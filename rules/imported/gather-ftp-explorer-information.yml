rule:
  meta:
    name: gather ftp-explorer information
    namespace: collection/file-managers
    scope: function
    authors:
      - "@_re_fox"
    description: gather ftp-explorer information
    references:
      - http://www.ftpx.com/
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Credential Access::Credentials from Password Stores [T1555]
  features:
    - or:
        - and:
            - substring: profiles.xml
            - or:
                - substring: Software\\FTP Explorer\\FTP Explorer\\Workspace\\MFCToolBar-224
                - substring: Software\\FTP Explorer\\Profiles
                - substring: \\FTP Explorer
        - and:
            - string: Password
            - string: Host
            - string: Login
            - string: InitialPath
            - string: PasswordType
            - string: Port

rule:
  meta:
    name: gather flashfxp information
    namespace: collection/file-managers
    scope: function
    authors:
      - "@_re_fox"
    description: gather flashfxp information
    references:
      - https://www.flashfxp.com/
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Credential Access::Credentials from Password Stores [T1555]
  features:
    - or:
        - and:
            - substring: Software\\FlashFXP
            - substring: DataFolder
            - substring: Install Path
        - and:
            - substring: \\Sites.dat
            - substring: \\Quick.dat
            - substring: \\History.dat

rule:
  meta:
    name: resolve function by parsing PE exports
    namespace: load-code/pe
    scope: function
    authors:
      - sara-rn
    description: resolve function by parsing PE exports
    references:
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
  features:
    - and:
        - os: windows
        - or:
            - characteristic: loop
            - mnemonic: movzx
        - and:
            - offset: 60
            - or:
                - and:
                    - arch: i386
                    - offset: 120
                - and:
                    - arch: amd64
                    - offset: 136
            - 3 or more:
                - offset: 20
                - offset: 36
                - offset: 32
                - offset: 24
                - offset: 28

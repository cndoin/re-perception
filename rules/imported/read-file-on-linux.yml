rule:
  meta:
    name: read file on Linux
    namespace: host-interaction/file-system/read
    scope: function
    authors:
      - joakim@intezer.com
    description: read file on Linux
    references:
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
  features:
    - and:
        - or:
            - os: linux
            - os: android
        - or:
            - api: fgetc
            - api: fgets
            - api: getc
            - api: getchar
            - api: read
            - api: getline
            - api: getdelim
            - api: fgetwc
            - api: getwc
            - api: fscanf
            - api: vfscanf
            - api: fread

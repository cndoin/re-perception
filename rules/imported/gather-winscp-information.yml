rule:
  meta:
    name: gather winscp information
    namespace: collection/file-managers
    scope: function
    authors:
      - "@_re_fox"
    description: gather winscp information
    references:
      - https://winscp.net/eng/download.php
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Credential Access::Credentials from Password Stores [T1555]
  features:
    - and:
        - string: Password
        - string: HostName
        - string: UserName
        - string: RemoteDirectory
        - string: PortNumber
        - string: FSProtocol

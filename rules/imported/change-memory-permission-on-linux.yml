rule:
  meta:
    name: change memory permission on Linux
    namespace: host-interaction/memory
    scope: function
    authors:
      - mehunhoff@google.com
    description: change memory permission on Linux
    references:
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
  features:
    - and:
        - or:
            - os: linux
            - os: android
        - or:
            - api: mprotect
            - api: pkey_mprotect

rule:
  meta:
    name: gather fasttrack-ftp information
    namespace: collection/file-managers
    scope: function
    authors:
      - "@_re_fox"
    description: gather fasttrack-ftp information
    references:
      - http://www.fasttracksoft.com/
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Credential Access::Credentials from Password Stores [T1555]
  features:
    - and:
        - string: FastTrack
        - string: ftplist.txt

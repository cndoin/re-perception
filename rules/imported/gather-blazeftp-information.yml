rule:
  meta:
    name: gather blazeftp information
    namespace: collection/file-managers
    scope: function
    authors:
      - "@_re_fox"
    description: gather blazeftp information
    references:
      - https://www.slimjet.com/blazeftp/
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Credential Access::Credentials from Password Stores [T1555]
  features:
    - and:
        - string: BlazeFtp
        - string: site.dat
        - or:
            - string: LastPassword
            - string: LastAddress
            - string: LastUser
            - string: LastPort
            - substring: Software\\FlashPeak\\BlazeFtp\\Settings

rule:
  meta:
    name: encrypt data using OpenSSL DSA
    namespace: data-manipulation/encryption/dsa
    scope: function
    authors:
      - Ana06
    description: encrypt data using OpenSSL DSA
    references:
      - https://github.com/openssl/openssl/blob/fdc5043d58900663b493147298e64f11353b35fe/crypto/objects/obj_dat.h
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
  features:
    - or:
        - bytes: 2B 0E 03 02 0D
        - bytes: 2B 0E 03 02 0C
        - bytes: 2B 0E 03 02 1B
        - bytes: 2A 86 48 CE 38 04 03
        - bytes: 60 86 48 01 65 03 04 03 01
        - bytes: 60 86 48 01 65 03 04 03 02

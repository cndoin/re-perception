rule:
  meta:
    name: gather securefx information
    namespace: collection/file-managers
    scope: function
    authors:
      - "@_re_fox"
    description: gather securefx information
    references:
      - https://www.vandyke.com/products/securefx/index.html
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Credential Access::Credentials from Password Stores [T1555]
  features:
    - and:
        - substring: \\Sessions
        - string: .ini
        - substring: Config Path
        - or:
            - substring: _VanDyke\\Config\\Sessions
            - substring: Software\\VanDyke\\SecureFX

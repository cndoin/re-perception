rule:
  meta:
    name: gather netdrive information
    namespace: collection/file-managers
    scope: function
    authors:
      - "@_re_fox"
    description: gather netdrive information
    references:
      - https://www.netdrive.net/
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Credential Access::Credentials from Password Stores [T1555]
  features:
    - and:
        - string: NDSites.ini
        - substring: \\NetDrive

rule:
  meta:
    name: compiled with exe4j
    namespace: compiler/exe4j
    scope: file
    authors:
      - johnk3r
    description: compiled with exe4j
    references:
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
  features:
    - or:
        - string: exe4j_log
        - string: install4j_log
        - string: exe4j_java_home
        - string: install4j
        - string: exe4j.isinstall4j
        - string: /com/exe4j/runtime/exe4jcontroller/i
        - string: /com/exe4j/runtime/winlauncher/i
        - string: EXE4J_LOG
        - string: INSTALL4J_LOG
        - string: EXE4J_JAVA_HOME
        - string: INSTALL4J
        - string: EXE4J.ISINSTALL4J

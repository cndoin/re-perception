rule:
  meta:
    name: receive HTTP request
    namespace: communication/http/server
    scope: basic block
    authors:
      - mehunhoff@google.com
    description: receive HTTP request
    references:
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
  features:
    - or:
        - and:
            - api: httpapi.HttpReceiveHttpRequest
            - or:
                - number: 0
                - number: 1
                - number: 2
        - and:
            - api: httpapi.HttpReceiveRequestEntityBody
            - or:
                - number: 0
                - number: 1

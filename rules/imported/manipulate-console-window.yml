rule:
  meta:
    name: manipulate console window
    namespace: host-interaction/console
    scope: function
    authors:
      - michael.hunhoff@mandiant.com
    description: manipulate console window
    references:
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
  features:

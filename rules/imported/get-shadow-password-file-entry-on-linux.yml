rule:
  meta:
    name: get shadow password file entry on Linux
    namespace: collection
    scope: instruction
    authors:
      - jonathanlepore@google.com
    description: get shadow password file entry on Linux
    references:
      - https://manpages.ubuntu.com/manpages/noble/man3/getspent.3.html
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
  features:
    - and:
        - os: linux
        - or:
            - api: getspent
            - api: getspent_r
            - api: fgetspent
            - api: fgetspent_r
            - api: getspnam
            - api: getspnam_r

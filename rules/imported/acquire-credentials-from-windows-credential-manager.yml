rule:
  meta:
    name: acquire credentials from Windows Credential Manager
    namespace: collection
    scope: function
    authors:
      - moritz.raabe@mandiant.com
    description: acquire credentials from Windows Credential Manager
    references:
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Credential Access::Credentials from Password Stores::Windows Credential Manager [T1555.004]
  features:
    - or:
        - string: .vcrd
        - string: "*.vcrd"
        - string: Policy.vpol
        - string: /AppData\\Local\\Microsoft\\(Vault|Credentials)/
        - api: CredEnumerate
        - or:
            - string: /vaultcmd(\.exe)?/
            - substring: "/listcreds:"
            - substring: \"Windows Credentials\"

rule:
  meta:
    name: gather cyberduck information
    namespace: collection/file-managers
    scope: function
    authors:
      - "@_re_fox"
    description: gather cyberduck information
    references:
      - https://cyberduck.io/ftp/
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Credential Access::Credentials from Password Stores [T1555]
  features:
    - and:
        - substring: \\Cyberduck
        - or:
            - string: user.config
            - string: .duck

rule:
  meta:
    name: set thread name on Linux
    namespace: host-interaction/thread
    scope: basic block
    authors:
      - michael.hunhoff@mandiant.com
    description: set thread name on Linux
    references:
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
  features:
    - and:
        - or:
            - os: linux
            - os: android
        - or:
            - api: pthread_setname_np
            - and:
                - api: prctl
                - number: 15

rule:
  meta:
    name: gather xftp information
    namespace: collection/file-managers
    scope: function
    authors:
      - "@_re_fox"
    description: gather xftp information
    references:
      - https://www.netsarang.com/en/xftp-download/
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Credential Access::Credentials from Password Stores [T1555]
  features:
    - and:
        - string: .xfp
        - substring: \\NetSarang

rule:
  meta:
    name: decrypt payload stored as IPv6 strings
    namespace: load-code
    scope: function
    authors:
      - corkami@google.com
    description: decrypt payload stored as IPv6 strings
    references:
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
  features:
    - and:
        - string: RtlIpv6StringToAddressA
        - or:
            - string: 4D5A:9000:0300:0000:0400:0000:FFFF:0000
            - string: 5648:89E6:4883:E4F0:4883:EC20:E80F:0000

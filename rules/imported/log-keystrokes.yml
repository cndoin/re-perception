rule:
  meta:
    name: log keystrokes
    namespace: collection/keylog
    scope: function
    authors:
      - moritz.raabe@mandiant.com
    description: log keystrokes
    references:
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Collection::Input Capture::Keylogging [T1056.001]
  features:
    - or:
        - and:
            - api: SetWindowsHookEx
            - api: GetKeyState
        - and:
            - api: RegisterHotKey
            - api: user32.keybd_event
            - api: UnregisterHotKey
        - and:
            - api: CallNextHookEx
            - api: user32.GetKeyNameText
            - api: user32.GetAsyncKeyState
            - api: user32.GetForgroundWindow
        - api: user32.AttachThreadInput
        - api: user32.MapVirtualKey

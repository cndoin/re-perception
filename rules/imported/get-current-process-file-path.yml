rule:
  meta:
    name: get current process file path
    namespace: host-interaction/process
    scope: basic block
    authors:
      - william.ballenthin@mandiant.com
    description: get current process file path
    references:
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
  features:
    - and:
        - os: linux
        - api: readlink
        - string: /proc/self/exe

rule:
  meta:
    name: capture network configuration via ipconfig
    namespace: collection/network
    scope: basic block
    authors:
      - "@_re_fox"
    description: capture network configuration via ipconfig
    references:
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Discovery::System Network Configuration Discovery [T1016]
  features:
    - and:
        - string: /ipconfig(\.exe)?/i
        - api: msvcr100.system

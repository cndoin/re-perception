rule:
  meta:
    name: create reverse shell
    namespace: communication/c2/shell
    scope: function
    authors:
      - moritz.raabe@mandiant.com
    description: create reverse shell
    references:
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Execution::Command and Scripting Interpreter::Windows Command Shell [T1059.003]
  features:
    - and:
        - match: create pipe
        - api: kernel32.PeekNamedPipe
        - api: kernel32.CreateProcess
        - api: kernel32.ReadFile
        - api: kernel32.WriteFile

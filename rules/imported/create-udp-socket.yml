rule:
  meta:
    name: create UDP socket
    namespace: communication/socket/udp/send
    scope: basic block
    authors:
      - moritz.raabe@mandiant.com
      - joakim@intezer.com
      - michael.hunhoff@mandiant.com
    description: create UDP socket
    references:
      - https://learn.microsoft.com/en-us/windows/win32/api/winsock2/nf-winsock2-socket
      - https://man7.org/linux/man-pages/man2/socket.2.html
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
  features:
    - or:
        - and:
            - number: 2
            - number: 2
            - number: 17
            - or:
                - api: socket
                - api: ws2_32.socket
                - api: ws2_32.#23 = socket
                - api: ws2_32.WSASocket
                - api: ws2_32.#82 = WSASocketA
                - api: ws2_32.#83 = WSASocketW
                - api: System.Net.Sockets.Socket::ctor
        - api: System.Net.Sockets.UdpClient::ctor

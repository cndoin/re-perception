rule:
  meta:
    name: resolve path using msvcrt
    namespace: host-interaction/cli
    scope: basic block
    authors:
      - "@_re_fox"
    description: resolve path using msvcrt
    references:
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Discovery::File and Directory Discovery [T1083]
  features:
    - or:
        - api: msvcrt.__p__pgmptr
        - api: msvcrt.__p__wpgmptr
        - api: msvcrt._get_pgmptr
        - api: msvcrt._get_wpgmptr
        - api: msvcrt._pgmptr
        - api: msvcrt._wpgmptr

rule:
  meta:
    name: gather turbo-ftp information
    namespace: collection/file-managers
    scope: function
    authors:
      - "@_re_fox"
    description: gather turbo-ftp information
    references:
      - https://www.tbsoftinc.com/
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Credential Access::Credentials from Password Stores [T1555]
  features:
    - or:
        - and:
            - string: addrbk.dat
            - string: quick.dat
        - and:
            - substring: installpath
            - or:
                - substring: Software\\TurboFTP
                - substring: \\TurboFTP

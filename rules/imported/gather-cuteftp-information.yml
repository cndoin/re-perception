rule:
  meta:
    name: gather cuteftp information
    namespace: collection/file-managers
    scope: function
    authors:
      - "@_re_fox"
    description: gather cuteftp information
    references:
      - https://en.wikipedia.org/wiki/CuteFTP
      - https://www.globalscape.com/cuteftp
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Credential Access::Credentials from Password Stores [T1555]
  features:
    - and:
        - substring: \\sm.dat
        - or:
            - string: /\\GlobalSCAPE\\CuteFTP/i
            - string: /\\GlobalSCAPE\\CuteFTP Pro/i
            - substring: \\CuteFTP

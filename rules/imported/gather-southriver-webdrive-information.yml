rule:
  meta:
    name: gather southriver-webdrive information
    namespace: collection/file-managers
    scope: function
    authors:
      - "@_re_fox"
    description: gather southriver-webdrive information
    references:
      - https://southrivertech.com/products/webdriveclient/
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Credential Access::Credentials from Password Stores [T1555]
  features:
    - or:
        - substring: Software\\South River Technologies\\WebDrive\\Connections
        - and:
            - string: PassWord
            - string: UserName
            - string: RootDirectory
            - string: Port
            - string: ServerType

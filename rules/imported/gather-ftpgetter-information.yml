rule:
  meta:
    name: gather ftpgetter information
    namespace: collection/file-managers
    scope: function
    authors:
      - "@_re_fox"
    description: gather ftpgetter information
    references:
      - https://www.ftpgetter.com/
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Credential Access::Credentials from Password Stores [T1555]
  features:
    - and:
        - string: servers.xml
        - substring: \\FTPGetter

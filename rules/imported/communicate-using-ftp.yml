rule:
  meta:
    name: communicate using FTP
    namespace: communication/ftp
    scope: instruction
    authors:
      - mehunhoff@google.com
    description: communicate using FTP
    references:
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
  features:
    - or:
        - api: FtpGetCurrentDirectory
        - api: FtpGetFile
        - api: FtpSetCurrentDirectory
        - api: FtpOpenFile
        - api: FtpGetFileSize
        - api: FtpDeleteFile
        - api: FtpCreateDirectory
        - api: FtpRemoveDirectory
        - api: FtpRenameFile
        - api: FtpDownload
        - api: FtpGetDirectory

rule:
  meta:
    name: get process heap flags
    namespace: host-interaction/process
    scope: basic block
    authors:
      - michael.hunhoff@mandiant.com
    description: get process heap flags
    references:
      - https://github.com/LordNoteworthy/al-khaser/blob/bed03d2f849d9060c68f8d5905bd204d0cb3f593/al-khaser/AntiDebug/ProcessHeap_Flags.cpp#L13
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Discovery::Process Discovery [T1057]
  features:
    - and:
        - or:
            - match: PEB access
            - api: GetProcessHeap
        - or:
            - and:
                - arch: i386
                - offset: 24
                - or:
                    - offset: 64
                    - offset: 12
            - and:
                - arch: amd64
                - offset: 48
                - or:
                    - offset: 112
                    - offset: 20

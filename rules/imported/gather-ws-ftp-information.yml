rule:
  meta:
    name: gather ws-ftp information
    namespace: collection/file-managers
    scope: function
    authors:
      - "@_re_fox"
    description: gather ws-ftp information
    references:
      - https://www.ipswitch.com/ftp-server
      - https://github.com/mandiant/capa-rules（规则来源，Apache-2.0）
    att_ck:
      - Credential Access::Credentials from Password Stores [T1555]
  features:
    - and:
        - substring: \\Ipswitch\\WS_FTP
        - substring: \\win.ini
        - substring: WS_FTP

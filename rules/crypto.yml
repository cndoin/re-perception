rule:
  meta:
    name: 哈希计算
    namespace: data-manipulation/hashing
    scope: function
    authors:
      - 寇豆码
    description: 计算 MD5/SHA/CRC 等摘要，常见于样本自校验、互斥体名与文件指纹
  features:
    - or:
      - api: advapi32.CryptCreateHash
      - api: bcrypt.BCryptCreateHash
      - api: bcrypt.BCryptHashData
      - api: ntdll.RtlComputeCrc32
      - characteristic: sha256_init
      - characteristic: md5_sha1_init
      - characteristic: crc32_table

---

rule:
  meta:
    name: Base64 编解码
    namespace: data-manipulation/encoding/base64
    scope: file
    authors:
      - 寇豆码
    att_ck:
      - Defense Evasion::Deobfuscate or Decode Files or Information [T1140]
    description: 出现 Base64 字母表，常用于配置外联载荷与隐藏字符串
  features:
    - or:
      - characteristic: base64
      - string: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/
      - api: crypt32.CryptBinaryToString
